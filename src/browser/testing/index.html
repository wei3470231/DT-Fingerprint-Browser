<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地指纹检测 · 实际读数</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./fingerprint-probe.js" defer></script>
  <script src="./page.js" defer></script>
</head>
<body>
  <header class="page-header">
    <span class="eyebrow">LOCAL FINGERPRINT LAB</span>
    <h1>当前实例 · 实际读数</h1>
    <p>读取当前页面的浏览器 API，查看实例之间的差异。</p>
    <div class="actions">
      <button id="measure" type="button">重新检测</button>
      <button id="copy" class="secondary" type="button" disabled>复制 JSON</button>
      <button id="download" class="secondary" type="button" disabled>下载 JSON</button>
    </div>
    <p id="status" role="status" aria-live="polite">准备读取当前页面…</p>
  </header>
  <main>
    <aside class="notice">摘要用于比较数值，<strong>不是检测评分</strong>。媒体仅枚举，不申请权限、不打开摄像头或麦克风；音频只做离线运算。</aside>
    <div id="summary" class="summary-grid" aria-label="主要摘要"></div>
    <div id="sections" class="sections"></div>
    <details id="raw-panel" class="card raw-panel" hidden>
      <summary>完整 JSON</summary>
      <pre id="raw"></pre>
    </details>
  </main>
  <footer>本页不发送检测结果。浏览器窗口、Worker、站点权限和安全策略可能产生不同读数。</footer>
</body>
</html>
